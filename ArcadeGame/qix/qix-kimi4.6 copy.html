<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QIX - Arcade Classic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050505;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-wrapper {
    position: relative;
    border: 3px solid #333;
    border-radius: 2px;
    background: #000;
    box-shadow: 0 0 30px rgba(0,255,255,0.15), inset 0 0 60px rgba(0,0,0,0.8);
  }
  canvas {
    display: block;
    width: 512px;
    height: 512px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
  #ui {
    display: flex;
    justify-content: space-between;
    width: 512px;
    padding: 6px 16px;
    background: #0a0a0a;
    border-bottom: 2px solid #222;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  #ui span.val { color: #0ff; font-weight: bold; }
  #ui span.label { color: #666; font-size: 11px; }
  #controls {
    margin-top: 10px;
    display: flex;
    gap: 10px;
  }
  button {
    background: #111;
    color: #0ff;
    border: 2px solid #0ff;
    padding: 6px 18px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 3px;
    transition: all 0.15s;
  }
  button:hover {
    background: #0ff;
    color: #000;
    box-shadow: 0 0 10px #0ff;
  }
  button:active { transform: scale(0.96); }
  #instructions {
    margin-top: 8px;
    font-size: 10px;
    color: #555;
    text-align: center;
    line-height: 1.5;
    letter-spacing: 1px;
  }
  #instructions kbd {
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 1px 5px;
    border-radius: 2px;
    color: #888;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.88);
    pointer-events: none;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 56px;
    color: #0ff;
    text-shadow: 0 0 15px #0ff, 0 0 30px #0ff, 0 0 60px #0088ff;
    letter-spacing: 12px;
    margin-bottom: 16px;
    font-weight: bold;
  }
  #overlay p {
    font-size: 12px;
    color: #888;
    margin: 3px 0;
    letter-spacing: 2px;
  }
  #overlay .blink {
    animation: blink 0.8s infinite;
    color: #ff0;
    margin-top: 24px;
    font-size: 14px;
    letter-spacing: 4px;
  }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  .crt::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 5;
  }
</style>
<base target="_blank">
</head>
<body>
<div id="game-wrapper" class="crt">
  <div id="ui">
    <div><span class="label">Score</span> <span class="val" id="score">0</span></div>
    <div><span class="label">High</span> <span class="val" id="highscore">0</span></div>
    <div><span class="label">Area</span> <span class="val" id="area">0</span><span class="label">%</span></div>
    <div><span class="label">Lives</span> <span class="val" id="lives">3</span></div>
  </div>
  <canvas id="c" width="256" height="256"></canvas>
  <div id="overlay">
    <h1>QIX</h1>
    <p>CONQUER 75% OF THE AREA TO ADVANCE</p>
    <p>AVOID THE QIX AND THE SPARX</p>
    <p>SPACE = FAST DRAW MODE</p>
    <p class="blink">PRESS START</p>
  </div>
</div>
<div id="controls">
  <button id="btnStart">START</button>
  <button id="btnPause">PAUSE</button>
  <button id="btnReset">RESET</button>
</div>
<div id="instructions">
  <kbd>ARROWS</kbd> MOVE &nbsp;|&nbsp; <kbd>SPACE</kbd> SLOW / FAST &nbsp;|&nbsp; <kbd>ENTER</kbd> START
</div>

<script>
(function(){
  'use strict';

  // ===== CONSTANTS =====
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 256, H = 256;
  const GRID = 2;
  const COLS = W / GRID;   // 128
  const ROWS = H / GRID;   // 128
  const TARGET_AREA = 75;

  // ===== AUDIO =====
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function tone(freq, dur, type, vol, when) {
    if (!audioCtx) return;
    const t = when || audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur);
  }
  function sfx(name) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    switch(name) {
      case 'step': tone(220, 0.03, 'square', 0.04, t); break;
      case 'draw': tone(440 + Math.random()*100, 0.05, 'sawtooth', 0.04, t); break;
      case 'claim': 
        tone(523, 0.1, 'square', 0.08, t);
        tone(659, 0.1, 'square', 0.08, t+0.08);
        tone(784, 0.15, 'square', 0.08, t+0.16);
        break;
      case 'die':
        tone(200, 0.3, 'sawtooth', 0.12, t);
        tone(150, 0.4, 'sawtooth', 0.1, t+0.2);
        tone(100, 0.5, 'sawtooth', 0.08, t+0.4);
        break;
      case 'win':
        for(let i=0;i<6;i++) tone(330+i*110, 0.12, 'square', 0.07, t+i*0.1);
        break;
      case 'start': tone(330, 0.3, 'square', 0.1, t); break;
      case 'fuse': tone(880, 0.04, 'square', 0.03, t); break;
    }
  }

  // ===== STATE =====
  let grid = [];
  let player, qix, sparx, fuse;
  let score = 0, highscore = 0, lives = 3, level = 1;
  let state = 'title'; // title, playing, paused, dying, gameover, win, levelup
  let animId = null, lastTime = 0;
  let keys = {};
  let deathTimer = 0, claimFlash = 0, levelUpTimer = 0;

  try { highscore = parseInt(localStorage.getItem('qix_high')) || 0; } catch(e){}

  // ===== INIT =====
  function initGrid() {
    grid = [];
    for (let y = 0; y < ROWS; y++) {
      grid[y] = [];
      for (let x = 0; x < COLS; x++) {
        grid[y][x] = (x===0 || x===COLS-1 || y===0 || y===ROWS-1) ? 1 : 0;
      }
    }
  }

  function resetGame() {
    initGrid();
    player = {
      x: 0, y: ROWS-1,
      drawing: false, fast: false,
      trail: [],
      moveTimer: 0,
      moveDelay: 90
    };
    qix = {
      x: COLS/2, y: ROWS/2,
      dx: 1.0, dy: 0.7,
      phase: 0
    };
    sparx = [];
    fuse = null;
    score = 0; lives = 3; level = 1;
    spawnSparx(2);
    updateUI();
    state = 'title';
    showOverlay(true);
    draw();
  }

  function spawnSparx(count) {
    sparx = [];
    let edge = [];
    for (let x=0; x<COLS; x++) { edge.push({x,y:0}); edge.push({x,y:ROWS-1}); }
    for (let y=1; y<ROWS-1; y++) { edge.push({x:0,y}); edge.push({x:COLS-1,y}); }
    for (let i=0; i<count; i++) {
      let p = edge[Math.floor(Math.random()*edge.length)];
      sparx.push({
        x: p.x, y: p.y,
        dir: [1,0],
        cw: Math.random() < 0.5,
        tick: Math.floor(Math.random()*10)
      });
    }
  }

  function getArea() {
    let filled = 0;
    for (let y=0; y<ROWS; y++)
      for (let x=0; x<COLS; x++)
        if (grid[y][x] === 1) filled++;
    return Math.floor((filled/(COLS*ROWS))*100);
  }

  function updateUI() {
    document.getElementById('score').textContent = score;
    document.getElementById('highscore').textContent = highscore;
    document.getElementById('area').textContent = getArea();
    document.getElementById('lives').textContent = lives;
  }

  function showOverlay(show) {
    document.getElementById('overlay').classList.toggle('hidden', !show);
  }

  function setOverlay(html) {
    document.getElementById('overlay').innerHTML = html;
  }

  // ===== AREA CLAIMING =====
  function closeArea() {
    // Convert trail to border temporarily for region detection
    for (let t of player.trail) grid[t.y][t.x] = 1;

    // Find all empty regions
    let visited = new Set();
    let regions = [];
    for (let y=1; y<ROWS-1; y++) {
      for (let x=1; x<COLS-1; x++) {
        if (grid[y][x] !== 0) continue;
        let key = x+","+y;
        if (visited.has(key)) continue;
        let region = [];
        let queue = [{x,y}];
        let hasQix = false;
        while (queue.length) {
          let c = queue.shift();
          let k = c.x+","+c.y;
          if (visited.has(k)) continue;
          visited.add(k);
          region.push(c);
          // Check if Qix is in this region (approximate)
          let qdx = c.x - qix.x, qdy = c.y - qix.y;
          if (qdx*qdx + qdy*qdy < 9) hasQix = true;
          [[0,1],[0,-1],[1,0],[-1,0]].forEach(d => {
            let nx=c.x+d[0], ny=c.y+d[1];
            if (nx>=0 && nx<COLS && ny>=0 && ny<ROWS && grid[ny][nx]===0 && !visited.has(nx+","+ny))
              queue.push({x:nx,y:ny});
          });
        }
        regions.push({cells: region, hasQix});
      }
    }

    let filled = 0;
    for (let r of regions) {
      if (!r.hasQix) {
        for (let c of r.cells) {
          grid[c.y][c.x] = 1;
          filled++;
        }
      }
    }

    player.trail = [];
    player.drawing = false;
    fuse = null;

    let mult = player.fast ? 2 : 1;
    score += filled * 10 * mult;
    claimFlash = 12;
    sfx('claim');
    updateUI();

    if (getArea() >= TARGET_AREA) {
      sfx('win');
      state = 'levelup';
      levelUpTimer = 120;
    }
  }

  // ===== LIFE / DEATH =====
  function loseLife() {
    sfx('die');
    lives--;
    // Clear trail back to empty
    for (let t of player.trail) {
      if (grid[t.y][t.x] === 2) grid[t.y][t.x] = 0;
    }
    player.trail = [];
    player.drawing = false;
    fuse = null;
    player.x = 0;
    player.y = ROWS-1;
    updateUI();
    if (lives <= 0) {
      state = 'gameover';
      if (score > highscore) {
        highscore = score;
        try { localStorage.setItem('qix_high', highscore); } catch(e){}
      }
    } else {
      state = 'dying';
      deathTimer = 50;
    }
  }

  // ===== MOVEMENT HELPERS =====
  function tryMovePlayer() {
    let dx = 0, dy = 0;
    if (keys['ArrowLeft']) dx = -1;
    else if (keys['ArrowRight']) dx = 1;
    else if (keys['ArrowUp']) dy = -1;
    else if (keys['ArrowDown']) dy = 1;
    if (dx===0 && dy===0) { player.moveTimer = 0; return; }

    player.moveTimer += 16; // approx dt per frame
    let delay = player.fast ? 45 : 90;
    if (player.moveTimer < delay) return;
    player.moveTimer = 0;

    let nx = player.x + dx;
    let ny = player.y + dy;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;

    let cell = grid[ny][nx];

    if (cell === 1) {
      // Border / claimed
      player.x = nx; player.y = ny;
      if (player.drawing) closeArea();
      if (!player.drawing) fuse = null;
      sfx('step');
    } else if (cell === 0) {
      // Empty
      if (!player.drawing) {
        if (grid[player.y][player.x] === 1) {
          player.drawing = true;
          player.trail = [{x: player.x, y: player.y}];
          fuse = {index: 0, timer: 200, active: false, x: player.x, y: player.y};
        }
      }
      if (player.drawing) {
        if (grid[ny][nx] === 2) return; // Can't cross own trail
        grid[ny][nx] = 2;
        player.trail.push({x: nx, y: ny});
        player.x = nx; player.y = ny;
        if (fuse) { fuse.timer = 200; fuse.active = false; }
        if (player.fast) sfx('draw');
      }
    }
  }

  function updateQix() {
    qix.phase += 0.15;
    qix.x += qix.dx;
    qix.y += qix.dy;
    let ix = Math.round(qix.x), iy = Math.round(qix.y);

    // Bounce
    let bounced = false;
    if (ix <= 0 || ix >= COLS-1 || (grid[iy] && (grid[iy][ix]===1 || grid[iy][ix]===2))) {
      qix.dx = -qix.dx + (Math.random()-0.5)*0.8;
      bounced = true;
    }
    if (iy <= 0 || iy >= ROWS-1 || (grid[iy] && (grid[iy][ix]===1 || grid[iy][ix]===2))) {
      qix.dy = -qix.dy + (Math.random()-0.5)*0.8;
      bounced = true;
    }
    if (bounced) {
      qix.x += qix.dx;
      qix.y += qix.dy;
    }
    qix.x = Math.max(1, Math.min(COLS-2, qix.x));
    qix.y = Math.max(1, Math.min(ROWS-2, qix.y));
  }

  function getLeft(dir) { return [dir[1], -dir[0]]; }
  function getRight(dir) { return [-dir[1], dir[0]]; }

  function updateSparx() {
    for (let s of sparx) {
      s.tick = (s.tick || 0) + 1;
      if (s.tick < 6 + Math.max(0, 4-level)) { s.tick++; continue; }
      s.tick = 0;
      let order = s.cw
        ? [getRight(s.dir), s.dir, getLeft(s.dir), [-s.dir[0],-s.dir[1]]]
        : [getLeft(s.dir), s.dir, getRight(s.dir), [-s.dir[0],-s.dir[1]]];
      let moved = false;
      for (let d of order) {
        let nx = s.x + d[0], ny = s.y + d[1];
        if (nx>=0 && nx<COLS && ny>=0 && ny<ROWS && grid[ny][nx] === 1) {
          s.x = nx; s.y = ny; s.dir = d; moved = true; break;
        }
      }
      if (!moved) {
        // Dead end, try any border
        [[0,1],[0,-1],[1,0],[-1,0]].forEach(d => {
          let nx = s.x + d[0], ny = s.y + d[1];
          if (nx>=0 && nx<COLS && ny>=0 && ny<ROWS && grid[ny][nx] === 1) {
            s.x = nx; s.y = ny; s.dir = d;
          }
        });
      }
    }
  }

  function updateFuse() {
    if (!fuse || !player.drawing) return;
    if (!fuse.active) {
      fuse.timer--;
      if (fuse.timer <= 0) {
        fuse.active = true;
        fuse.timer = 15;
      }
    } else {
      fuse.timer--;
      if (fuse.timer <= 0) {
        fuse.timer = 15;
        if (fuse.index < player.trail.length) {
          let t = player.trail[fuse.index];
          fuse.x = t.x; fuse.y = t.y; fuse.index++;
          sfx('fuse');
        } else {
          loseLife();
        }
      }
    }
  }

  function checkCollisions() {
    if (state !== 'playing') return;
    // Qix vs player
    let d = (player.x-qix.x)**2 + (player.y-qix.y)**2;
    if (d < 6) { loseLife(); return; }
    // Qix vs trail
    if (player.drawing) {
      for (let t of player.trail) {
        let td = (t.x-qix.x)**2 + (t.y-qix.y)**2;
        if (td < 6) { loseLife(); return; }
      }
    }
    // Sparx vs player
    for (let s of sparx) {
      let sd = (player.x-s.x)**2 + (player.y-s.y)**2;
      if (sd < 3) { loseLife(); return; }
    }
    // Fuse vs player
    if (fuse && fuse.active) {
      let fd = (player.x-fuse.x)**2 + (player.y-fuse.y)**2;
      if (fd < 2) { loseLife(); return; }
    }
  }

  // ===== GAME FLOW =====
  function startGame() {
    initAudio();
    if (state === 'title' || state === 'gameover') {
      resetGame();
      state = 'playing';
      sfx('start');
      showOverlay(false);
      lastTime = performance.now();
      animId = requestAnimationFrame(loop);
    } else if (state === 'paused') {
      state = 'playing';
      showOverlay(false);
      lastTime = performance.now();
      animId = requestAnimationFrame(loop);
    }
  }

  function pauseGame() {
    if (state === 'playing') {
      state = 'paused';
      setOverlay('<h1>PAUSED</h1><p class="blink">PRESS START</p>');
      showOverlay(true);
    }
  }

  function nextLevel() {
    level++;
    initGrid();
    player.x = 0; player.y = ROWS-1;
    player.drawing = false; player.trail = []; player.fast = false;
    qix.x = COLS/2; qix.y = ROWS/2;
    qix.dx = 0.8 + level*0.25; qix.dy = 0.6 + level*0.2;
    spawnSparx(Math.min(2 + Math.floor(level/2), 6));
    state = 'playing';
    updateUI();
  }

  // ===== UPDATE =====
  function update() {
    if (state === 'playing') {
      tryMovePlayer();
      updateQix();
      updateSparx();
      updateFuse();
      checkCollisions();
    } else if (state === 'dying') {
      deathTimer--;
      if (deathTimer <= 0) state = 'playing';
    } else if (state === 'levelup') {
      levelUpTimer--;
      if (levelUpTimer <= 0) nextLevel();
    }
  }

  // ===== RENDER =====
  function draw() {
    // Clear
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Grid cells
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        let cell = grid[y][x];
        let px = x * GRID, py = y * GRID;
        if (cell === 1) {
          // Claimed area - diagonal stripe pattern
          if ((x + y) % 3 === 0) {
            ctx.fillStyle = '#003838';
            ctx.fillRect(px, py, GRID, GRID);
          } else if ((x + y) % 3 === 1) {
            ctx.fillStyle = '#002828';
            ctx.fillRect(px, py, GRID, GRID);
          }
        } else if (cell === 2) {
          // Trail
          ctx.fillStyle = player.fast ? '#ff00aa' : '#00ffff';
          ctx.fillRect(px, py, GRID, GRID);
        }
      }
    }

    // Outer border glow
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 1;
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 6;
    ctx.strokeRect(0.5, 0.5, W-1, H-1);
    ctx.shadowBlur = 0;

    // Qix
    ctx.save();
    ctx.translate(qix.x * GRID, qix.y * GRID);
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 1.2;
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 10;
    let arms = 14;
    for (let i = 0; i < arms; i++) {
      let a1 = (i / arms) * Math.PI * 2 + qix.phase * 0.4;
      let r1 = 3 + Math.sin(qix.phase * 2.5 + i * 1.1) * 2.5;
      let x1 = Math.cos(a1) * r1, y1 = Math.sin(a1) * r1;
      let a2 = a1 + Math.sin(qix.phase + i) * 0.4;
      let r2 = 8 + Math.cos(qix.phase * 1.8 + i * 0.7) * 4;
      let x2 = Math.cos(a2) * r2, y2 = Math.sin(a2) * r2;
      let a3 = a2 + Math.cos(qix.phase * 2 + i * 0.5) * 0.3;
      let r3 = 13 + Math.sin(qix.phase * 3 + i) * 5;
      let x3 = Math.cos(a3) * r3, y3 = Math.sin(a3) * r3;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(x1,y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x3,y3); ctx.stroke();
    }
    ctx.restore();
    ctx.shadowBlur = 0;

    // Sparx
    for (let s of sparx) {
      ctx.save();
      ctx.translate(s.x * GRID, s.y * GRID);
      ctx.fillStyle = '#ff6600';
      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(0, -4); ctx.lineTo(4, 0); ctx.lineTo(0, 4); ctx.lineTo(-4, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    // Fuse
    if (fuse && fuse.active) {
      ctx.save();
      ctx.translate(fuse.x * GRID, fuse.y * GRID);
      ctx.fillStyle = '#ff0000';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 8;
      let pulse = 2 + Math.sin(Date.now()/50) * 2;
      ctx.beginPath(); ctx.arc(0, 0, pulse, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    // Player
    if (state !== 'dying' || (deathTimer % 10 < 5)) {
      ctx.save();
      ctx.translate(player.x * GRID, player.y * GRID);
      ctx.fillStyle = player.fast ? '#ffffff' : '#00ff00';
      ctx.shadowColor = player.fast ? '#ffffff' : '#00ff00';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(0, -5); ctx.lineTo(4, 0); ctx.lineTo(0, 5); ctx.lineTo(-4, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    // Claim flash
    if (claimFlash > 0) {
      claimFlash--;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(0, 0, W, H);
    }

    // Death flash
    if (state === 'dying') {
      ctx.fillStyle = 'rgba(255,0,0,' + (deathTimer/60) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // Level up flash
    if (state === 'levelup') {
      ctx.fillStyle = 'rgba(0,255,0,0.2)';
      ctx.fillRect(0, 0, W, H);
    }

    // Scanlines
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let y = 0; y < H; y += 2) {
      ctx.fillRect(0, y, W, 1);
    }

    // Overlays inside canvas
    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff0000';
      ctx.font = 'bold 22px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', W/2, H/2 - 12);
      ctx.fillStyle = '#0ff';
      ctx.font = '12px Courier New';
      ctx.fillText('SCORE: ' + score, W/2, H/2 + 10);
      ctx.fillText('HIGH:  ' + highscore, W/2, H/2 + 26);
      ctx.fillStyle = '#ff0';
      ctx.fillText('PRESS START', W/2, H/2 + 48);
    }
  }

  // ===== LOOP =====
  function loop(time) {
    update();
    draw();
    if (state === 'playing' || state === 'dying' || state === 'levelup') {
      animId = requestAnimationFrame(loop);
    }
  }

  // ===== INPUT =====
  window.addEventListener('keydown', e => {
    let wasPressed = keys[e.key];
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      player.fast = !player.fast;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      startGame();
    }
    if (!wasPressed && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
      player.moveTimer = 999; // Force immediate move on key press
    }
  });
  window.addEventListener('keyup', e => {
    keys[e.key] = false;
    if (!keys['ArrowUp'] && !keys['ArrowDown'] && !keys['ArrowLeft'] && !keys['ArrowRight']) {
      player.moveTimer = 0;
    }
  });

  document.getElementById('btnStart').addEventListener('click', startGame);
  document.getElementById('btnPause').addEventListener('click', pauseGame);
  document.getElementById('btnReset').addEventListener('click', () => {
    cancelAnimationFrame(animId);
    resetGame();
  });

  // Init
  resetGame();
})();
</script>
</body>
</html>
